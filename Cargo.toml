[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/api-cli",
  "crates/api-core",
  "crates/api-repository",
  "crates/api-discovery",
  "crates/api-analyzers",
  "crates/api-compiler",
  "crates/api-mock-runtime",
  "crates/api-client",
  "crates/api-storage",
  "crates/api-runtime-events",
  "crates/api-watch",
  "crates/api-testing",
  "crates/api-workbench", "crates/api-projects", "crates/api-workflows", "crates/api-vault", "crates/api-desktop", "crates/api-desktop-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
notify = "8"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
