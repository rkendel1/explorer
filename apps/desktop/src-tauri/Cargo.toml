[package]
name = "repo-api-desktop"
version = "0.1.0"
edition = "2021"
description = "Repo API Desktop Application"
license = "MIT"
repository = "https://github.com/repo-api/repo-api"
default-run = "repo-api-desktop"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Link to our desktop app library
api-desktop-app = { path = "../../../crates/api-desktop-app" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
